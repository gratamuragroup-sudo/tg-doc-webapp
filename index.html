<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор доверенности</title>
  <!-- Подключаем Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      color: var(--tg-theme-hint-color, #888888);
    }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #000000);
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Форма доверенности</h2>
  
  <div class="form-group">
    <label for="principal">ФИО Доверителя:</label>
    <input type="text" id="principal" placeholder="Иванов Иван Иванович">
  </div>

  <div class="form-group">
    <label for="agent">ФИО Поверенного:</label>
    <input type="text" id="agent" placeholder="Петров Петр Петрович">
  </div>

  <div class="form-group">
    <label for="date">Дата выдачи:</label>
    <input type="date" id="date">
  </div>

  <button onclick="sendData()">Сгенерировать</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем окно на весь экран

    function sendData() {
      const principal = document.getElementById('principal').value;
      const agent = document.getElementById('agent').value;
      const date = document.getElementById('date').value;

      if (!principal || !agent || !date) {
        alert('Заполните все поля!');
        return;
      }

      const payload = { principal, agent, date };

      // Отправляем данные боту и закрываем Web App
      tg.sendData(JSON.stringify(payload));
    }
  </script>
</body>
</html>
